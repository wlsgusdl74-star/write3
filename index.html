<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 학급 신문 작성 도우미</title>
  
  <!-- Tailwind CSS -->
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)" crossorigin></script>
  <script src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)" crossorigin></script>
  
  <!-- Babel for JSX Compilation -->
  <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>

  <style>
    @import url('[https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css](https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css)');
    @import url('[https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap](https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap)');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .newspaper-font {
      font-family: 'Gowun Batang', serif;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-pop-in {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const SCRIPT_URL = "[https://script.google.com/macros/s/AKfycbzHFQIAmMj-fRxn3yYtX97sfIrn5jdwKM2VgEg0dXOg9PJh3jQhiC7Fc3o4vA3wGAtwAw/exec](https://script.google.com/macros/s/AKfycbzHFQIAmMj-fRxn3yYtX97sfIrn5jdwKM2VgEg0dXOg9PJh3jQhiC7Fc3o4vA3wGAtwAw/exec)"; 
    const GEMINI_API_KEY = ""; 

    const { useState, useEffect, useRef } = React;

    const EXPANSION_QUESTIONS = [
      '💡 그 활동을 할 때 마음이나 기분은 어땠나요?',
      '💡 가장 재미있거나 기억에 남는 장면은 무엇이었나요?',
      '💡 같이 한 친구나 선생님에게 전하고 싶은 말은 무엇인가요?'
    ];

    const MOOD_OPTIONS = ['😊 신나고 즐거워요', '🥰 뿌듯하고 행복해요', '🤔 신기하고 재미있어요', '😌 편안하고 유익해요', '🔥 의욕이 넘쳐요'];

    function App() {
      const [activeTab, setActiveTab] = useState('student');
      
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [loginClass, setLoginClass] = useState(''); 
      const [registerClass, setRegisterClass] = useState(''); 
      const [passwordInput, setPasswordInput] = useState(''); 
      const [loggedInTeacher, setLoggedInTeacher] = useState(''); 
      const passwordInputRef = useRef(null);

      const [studentName, setStudentName] = useState('');
      const [targetTeacher, setTargetTeacher] = useState(''); 
      const [activityTitle, setActivityTitle] = useState('');
      const [mood, setMood] = useState('😊 신나고 즐거워요');
      const [shortMsg, setShortMsg] = useState('');
      const [step, setStep] = useState(1);
      
      const [w6, setW6] = useState({ who: '', when: '', where: '', what: '', how: '', why: '' });
      const [sentence1, setSentence1] = useState('');
      const [sentence2, setSentence2] = useState('');
      const [sentence3, setSentence3] = useState('');
      const [sentence4, setSentence4] = useState('');
      const [selectedQuestion, setSelectedQuestion] = useState(EXPANSION_QUESTIONS[0]);
      const [draftText, setDraftText] = useState('');
      const [focusedField, setFocusedField] = useState('sentence1');
      const [grammarIssues, setGrammarIssues] = useState([]);
      
      const [isGeneratingTitle, setIsGeneratingTitle] = useState(false);
      const [suggestedTitles, setSuggestedTitles] = useState([]);

      const [teacherDataList, setTeacherDataList] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [loadingText, setLoadingText] = useState('처리 중입니다...');
      const [toastMsg, setToastMsg] = useState(null);

      const [showCanvasModal, setShowCanvasModal] = useState(false);
      const [canvasArticles, setCanvasArticles] = useState([]);
      const [selectedClassForCanvas, setSelectedClassForCanvas] = useState('');

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      useEffect(() => {
        if (showPasswordModal && passwordInputRef.current) {
          setTimeout(() => passwordInputRef.current.focus(), 100);
        }
      }, [showPasswordModal, authMode]);

      useEffect(() => {
        if (activeTab === 'teacher' && loggedInTeacher) fetchSheetData();
      }, [activeTab, loggedInTeacher]);

      const fetchSheetData = async () => {
        setIsLoading(true);
        setLoadingText('📊 데이터를 불러오는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getData`).catch(() => null);
          if (!response || !response.ok) {
            triggerToast('⚠️ 서버 연결이 원활하지 않습니다.');
            setTeacherDataList([]);
            return;
          }
          const result = await response.json();
          if (result.success) {
            setTeacherDataList(result.data || []);
          } else {
            triggerToast('❌ 조회 실패: ' + (result.message || '오류 발생'));
          }
        } catch (err) {
          triggerToast('❌ 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const openCanvasModal = async (className) => {
        const targetCls = className || targetTeacher.trim() || loggedInTeacher;
        if (!targetCls) return triggerToast('⚠️ 확인할 반 이름을 입력해주세요!');

        setIsLoading(true);
        setLoadingText('📰 신문 캔버스를 불러오는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getData`).catch(() => null);
          if (!response || !response.ok) {
            triggerToast('⚠️ 데이터를 불러오지 못했습니다.');
            return;
          }
          const result = await response.json();
          if (result.success) {
            const filtered = (result.data || []).filter(row => row.targetTeacher === targetCls);
            setCanvasArticles(filtered);
            setSelectedClassForCanvas(targetCls);
            setShowCanvasModal(true);
          }
        } catch (err) {
          triggerToast('❌ 통신 오류 발생');
        } finally {
          setIsLoading(false);
        }
      };

      const handleTeacherRegister = async () => {
        const trimmedClass = registerClass.trim();
        if (!trimmedClass) return triggerToast('⚠️ 반 이름을 입력해주세요.');
        if (!passwordInput.trim()) return triggerToast('⚠️ 비밀번호를 입력해주세요.');

        setIsLoading(true);
        setLoadingText('새로운 반을 등록하는 중...');
        
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'registerTeacher', className: trimmedClass, password: passwordInput }),
            redirect: 'follow'
          });
          
          const text = await response.text();
          try {
            const result = JSON.parse(text);
            if (result.success) {
              triggerToast(`🎉 [${trimmedClass}] 반이 등록되었습니다!`);
              setLoggedInTeacher(trimmedClass);
              setShowPasswordModal(false);
              setPasswordInput('');
              setRegisterClass('');
              setActiveTab('teacher');
            } else {
              triggerToast('❌ 등록 실패: ' + result.message);
            }
          } catch (parseError) {
            triggerToast('❌ 구글 서버 응답 오류 발생');
          }
        } catch (err) {
          triggerToast('❌ 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleTeacherLogin = async () => {
        const trimmedLoginClass = loginClass.trim();
        if (!trimmedLoginClass) return triggerToast('⚠️ 로그인할 반 이름을 입력해주세요.');
        if (!passwordInput.trim()) return triggerToast('⚠️ 비밀번호를 입력해주세요.');

        setIsLoading(true);
        setLoadingText('비밀번호 확인 중...');
        
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'loginTeacher', className: trimmedLoginClass, password: passwordInput }),
            redirect: 'follow'
          });
          
          const text = await response.text();
          try {
            const result = JSON.parse(text);
            if (result.success) {
              setShowPasswordModal(false);
              setPasswordInput('');
              setLoginClass('');
              setLoggedInTeacher(trimmedLoginClass);
              setActiveTab('teacher');
              triggerToast(`🔓 환영합니다, ${trimmedLoginClass} 선생님!`);
            } else {
              triggerToast('❌ 로그인 실패: 반 이름이나 비밀번호가 틀렸습니다.');
              setPasswordInput('');
            }
          } catch(e) {
            triggerToast('❌ 구글 서버 응답 오류 발생');
          }
        } catch (err) {
          triggerToast('❌ 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleClearSheet = async () => {
        if (!window.confirm(`정말로 [${loggedInTeacher}] 반의 응답 데이터를 초기화하시겠습니까?`)) return;
        
        setIsLoading(true);
        setLoadingText('🗑️ 응답 데이터를 비우는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=clearData&teacher=${encodeURIComponent(loggedInTeacher)}`);
          const result = await response.json();
          if (result.success) {
            triggerToast(result.message);
            fetchSheetData();
          } else {
            triggerToast('❌ ' + result.message);
          }
        } catch (err) {
          triggerToast('❌ 통신 오류 발생');
        } finally {
          setIsLoading(false);
        }
      };

      const handleSaveToSpreadsheet = async () => {
        const finalTeacher = targetTeacher.trim();
        if (!studentName.trim() || !activityTitle.trim()) return triggerToast('⚠️ 학생 이름과 기사 주제를 모두 입력해 주세요!');
        if (!finalTeacher) return triggerToast('⚠️ 우리 반 이름을 입력해 주세요!');

        setIsLoading(true);
        setLoadingText('🚀 기사를 제출하는 중...');

        const payload = {
          action: 'saveArticle',
          name: studentName, 
          activityTitle: activityTitle, 
          mood: mood, 
          shortMsg: shortMsg,
          w6: w6, 
          sentence1: sentence1, 
          sentence2: sentence2, 
          sentence3: sentence3, 
          sentence4: sentence4, 
          draftText: draftText,
          targetTeacher: finalTeacher 
        };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const text = await response.text();
          const result = JSON.parse(text);
          if (result.success) {
            triggerToast(result.message || '🎉 기사가 성공적으로 제출되었습니다!');
            setStudentName('');
            setActivityTitle('');
            setShortMsg('');
            setW6({ who: '', when: '', where: '', what: '', how: '', why: '' });
            setSentence1(''); setSentence2(''); setSentence3(''); setSentence4('');
            setDraftText('');
            setStep(1);
          } else {
            triggerToast('❌ 제출 실패: ' + result.message);
          }
        } catch (err) {
          triggerToast('❌ 저장 실패: 네트워크 연결을 확인해 주세요.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleGenerateTitles = async () => {
        if (!draftText || draftText.trim() === '') return triggerToast('💡 먼저 기사 내용을 완성해주세요!');
        if (!GEMINI_API_KEY) return triggerToast('⚠️ GEMINI_API_KEY를 입력해주세요.');

        setIsGeneratingTitle(true);
        triggerToast('🤖 AI 도우미가 제목을 고민하고 있어요...');

        try {
          const payload = {
            contents: [{ parts: [{ text: `다음 초등학생이 작성한 기사를 읽고 재미있는 기사 제목 3개를 JSON 배열로 추천해줘: ["제목1", "제목2", "제목3"]\n\n기사 내용: "${draftText}"` }] }],
            generationConfig: { responseMimeType: "application/json" }
          };

          const apiUrl = `[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){GEMINI_API_KEY}`;
          const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const result = await response.json();

          if (result.candidates && result.candidates[0].content?.parts?.[0]?.text) {
            let jsonText = result.candidates[0].content.parts[0].text.replace(/^```json/i, '').replace(/```$/i, '').trim();
            setSuggestedTitles(JSON.parse(jsonText));
            triggerToast('✨ AI 도우미가 제목을 추천했어요!');
          } else {
            triggerToast('❌ 제목 생성에 실패했습니다.');
          }
        } catch (error) {
          triggerToast('❌ AI 서버 통신 중 문제가 발생했습니다.');
        } finally {
          setIsGeneratingTitle(false);
        }
      };

      const insertWordChip = (word) => {
        if (!word) return;
        const addSpace = (prev) => (prev ? `${prev.trim()} ${word}` : word);
        if (focusedField === 'sentence1') setSentence1(addSpace);
        else if (focusedField === 'sentence2') setSentence2(addSpace);
        else if (focusedField === 'sentence3') setSentence3(addSpace);
        else if (focusedField === 'sentence4') setSentence4(addSpace);
        else if (focusedField === 'draftText') setDraftText(addSpace);
        triggerToast(`✨ "${word}" 단어를 넣었습니다!`);
      };

      const combineSentences = () => {
        const combined = [sentence1, sentence2, sentence3, sentence4].map(s => s.trim()).filter(Boolean).join(' ');
        if (!combined) return triggerToast('💡 문장을 하나 이상 입력해 주세요!');
        setDraftText(combined);
        triggerToast('🎉 문장들이 연결되었습니다!');
      };

      const scanGrammar = () => {
        triggerToast('🔍 맞춤법을 검사하고 있습니다...');
        let issues = [];
        if (draftText.includes('떡뽂이')) issues.push({ id: 'g1', errorWord: '떡뽂이', correct: '떡볶이', options: ['떡뽂이', '떡볶이'], desc: "'볶다'에서 온 말이므로 '떡볶이'가 바른 표현이에요!" });
        if (draftText.includes('맛있엇다')) issues.push({ id: 'g2', errorWord: '맛있엇다', correct: '맛있었다', options: ['맛있엇다', '맛있었다'], desc: "지난 일은 쌍시옷(ㅆ)을 써서 '맛있었다'로 써요!" });
        if (issues.length === 0) issues.push({ id: 'g3', errorWord: '참 재밌엇다', correct: '참 재미있었다', options: ['참 재밌엇다', '참 재미있었다'], desc: "'재미있었다'로 바르게 고쳐주세요!" });
        setGrammarIssues(issues);
      };

      const resolveIssue = (issueId, selected, correct) => {
        if (selected !== correct) return triggerToast('💡 다시 한번 생각해보세요!');
        setDraftText((prev) => prev.replace(/떡뽂이/g, correct)); 
        setGrammarIssues((prev) => prev.map((item) => item.id === issueId ? { ...item, resolved: true } : item));
        triggerToast('💮 정답 도장이 찍혔습니다!');
      };

      const downloadCSV = () => {
        const myClassData = teacherDataList.filter(row => row.targetTeacher === loggedInTeacher);
        if (myClassData.length === 0) return triggerToast('⚠️ 다운로드할 우리 반 데이터가 없습니다.');
        
        let csvContent = '\uFEFF응답 일시,이름,기분,한 줄 메시지,기사 주제,누가,언제,어디서,무엇을,어떻게,왜,최종기사문\n';
        myClassData.forEach((row) => {
          const safe = (txt) => `"${(txt || '').toString().replace(/"/g, '""')}"`;
          csvContent += `${safe(row.timestamp)},${safe(row.name)},${safe(row.mood)},${safe(row.shortMsg)},${safe(row.activityTitle)},${safe(row.w6?.who)},${safe(row.w6?.when)},${safe(row.w6?.where)},${safe(row.w6?.what)},${safe(row.w6?.how)},${safe(row.w6?.why)},${safe(row.draftText)}\n`;
        });
        const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
        const a = document.createElement('a');
        a.href = url; a.download = `학급신문_${loggedInTeacher}_응답목록.csv`;
        a.click();
      };

      return (
        <div className="min-h-screen pb-24 relative">
          {isLoading && (
            <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center text-white px-4">
              <div className="bg-white text-slate-900 p-6 rounded-3xl shadow-2xl flex flex-col items-center gap-4 max-w-sm w-full border border-slate-100">
                <div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <p className="font-extrabold text-base text-center">{loadingText}</p>
              </div>
            </div>
          )}

          {showCanvasModal && (
            <div className="fixed inset-0 z-[70] bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-4 overflow-y-auto">
              <div className="bg-amber-50 text-slate-900 w-full max-w-4xl rounded-[2.5rem] shadow-2xl border-4 border-amber-900/20 p-8 my-8 animate-pop-in relative">
                
                <button onClick={() => setShowCanvasModal(false)} className="absolute top-6 right-6 w-10 h-10 bg-amber-900 text-amber-50 rounded-full font-black text-lg flex items-center justify-center shadow-lg hover:bg-amber-800 transition-all cursor-pointer">✕</button>

                <div className="text-center border-b-4 border-double border-amber-900 pb-6 mb-8">
                  <div className="text-xs font-bold tracking-widest text-amber-800 uppercase mb-1">우리 반 특별 기획 호외</div>
                  <h2 className="text-4xl sm:text-5xl font-black newspaper-font text-amber-950 tracking-tight">[{selectedClassForCanvas}] 학 급 신 문</h2>
                  <div className="flex justify-between items-center text-xs font-bold text-amber-800 mt-3 px-4 border-t border-b border-amber-900/30 py-1">
                    <span>발행일: {new Date().toLocaleDateString()}</span>
                    <span>우리 반 친구들의 소중한 이야기</span>
                    <span>총 기사: {canvasArticles.length}편</span>
                  </div>
                </div>

                {canvasArticles.length === 0 ? (
                  <div className="text-center py-16 text-amber-800 font-bold text-lg newspaper-font">
                    아직 등록된 기사가 없습니다. 먼저 기사를 제출해 주세요!
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-h-[60vh] overflow-y-auto pr-2">
                    {canvasArticles.map((art, idx) => (
                      <div key={art.id || idx} className="bg-white p-6 rounded-2xl border-2 border-amber-900/20 shadow-sm flex flex-col justify-between space-y-4">
                        <div className="space-y-2">
                          <div className="flex justify-between items-center text-xs font-bold text-slate-500 border-b pb-2">
                            <span className="bg-amber-100 text-amber-900 px-2.5 py-0.5 rounded font-black">{art.mood || '😊 신나고 즐거워요'}</span>
                            <span>기자: <strong>{art.name}</strong></span>
                          </div>
                          <h3 className="text-xl font-black newspaper-font text-slate-900 leading-snug">{art.activityTitle}</h3>
                          <p className="text-sm font-medium text-slate-700 newspaper-font leading-relaxed whitespace-pre-wrap">{art.draftText}</p>
                        </div>
                        {art.shortMsg && (
                          <div className="bg-amber-50/80 p-3 rounded-xl border border-amber-200 text-xs text-amber-900 font-bold italic">
                            " {art.shortMsg} " - {art.name}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                <div className="text-center mt-8 pt-4 border-t border-amber-900/20">
                  <button onClick={() => setShowCanvasModal(false)} className="bg-amber-900 text-amber-50 px-8 py-3.5 rounded-2xl font-black text-sm shadow-lg hover:bg-amber-800 cursor-pointer">
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {showPasswordModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/85 backdrop-blur-sm flex flex-col items-center justify-center px-4">

                                <div className="truncate font-black text-xs text-slate-800">{val || '미입력'}</div>
                              </button>
                            );
                          })}

                            <label className="text-xs font-black text-slate-700">3번 문장 (왜, 느낌)</label>

                            </div>
                            <div className="text-xs font-bold text-purple-800 bg-white/60 p-2 rounded-lg">{selectedQuestion}</div>
                            <input type="text" value={sentence4} onFocus={() => setFocusedField('sentence4')} onChange={(e) => setSentence4(e.target.value)} placeholder="질문에 대한 내 생각을 적어보세요." className="w-full px-4 py-3 bg-white rounded-xl border border-purple-200 font-bold text-sm outline-none shadow-sm"/>
                          </div>
                        </div>

                        <button onClick={combineSentences} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black text-base py-4 rounded-xl shadow-lg transition-all cursor-pointer">

                        <textarea value={draftText} onFocus={() => setFocusedField('draftText')} onChange={(e) => setDraftText(e.target.value)} placeholder="왼쪽에서 문장을 합치면 이곳에 글이 나타납니다." rows={14} className="w-full p-5 bg-slate-50 rounded-2xl border font-medium text-base leading-loose outline-none shadow-inner resize-none focus:bg-white"/>
                      </div>

                      <div className="flex justify-end mt-6 pt-4 border-t">

                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-md space-y-8">

                    </div>

                    <div className="bg-gradient-to-br from-purple-50 to-indigo-50 p-6 rounded-3xl border border-purple-200 space-y-5">

                        <div>
                          <h3 className="text-lg font-black text-purple-900">✨ 기사 제목 정하기 <span className="bg-purple-600 text-white text-[10px] px-2 py-0.5 rounded-full">AI</span></h3>
                          <p className="text-xs font-bold text-purple-600 mt-1">AI에게 어울리는 제목을 추천받아 보세요!</p>

                        </button>
                      </div>
                      
                      <input type="text" value={activityTitle} onChange={(e) => setActivityTitle(e.target.value)} placeholder="기사 제목 입력" className="w-full px-5 py-4 bg-white rounded-2xl border-2 border-purple-300 font-black text-lg text-purple-900 text-center outline-none shadow-sm"/>

                          {suggestedTitles.map((title, idx) => (
                            <button key={idx} onClick={() => { setActivityTitle(title); triggerToast('제목이 선택되었습니다!'); }} className="px-4 py-2 bg-white border-2 border-purple-200 hover:border-purple-500 text-purple-800 text-sm font-bold rounded-xl shadow-sm cursor-pointer">

                            </button>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="bg-slate-50 p-6 rounded-3xl border space-y-3">

                              {issue.resolved && <span className="text-xs font-black text-emerald-600 bg-emerald-100 px-2 py-1 rounded-md">해결됨!</span>}

                            <p className="text-xs font-bold text-slate-500 mb-4">{issue.desc}</p>
                            <div className="flex gap-2">
                              {issue.options.map((opt, idx) => (
                                <button key={idx} onClick={() => resolveIssue(issue.id, opt, issue.correct)} disabled={issue.resolved} className={`flex-1 py-2.5 rounded-xl font-bold text-sm border cursor-pointer ${issue.resolved && opt === issue.correct ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-50'}`}>{opt}</button>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="bg-indigo-50 p-7 rounded-3xl border border-indigo-200 space-y-5">
                      <h3 className="text-lg font-black text-indigo-900">📮 {targetTeacher ? `[${targetTeacher}] 반에` : ''} 제출하기</h3>
                      <div>
                        <label className="text-sm font-extrabold text-indigo-800 block mb-2">💬 한 줄 소감</label>
                        <input type="text" value={shortMsg} onChange={(e) => setShortMsg(e.target.value)} placeholder="예: 기사를 완성해서 뿌듯합니다!" className="w-full px-5 py-3.5 bg-white rounded-2xl border-2 border-indigo-200 font-bold text-sm outline-none shadow-sm"/>
                      </div>
                      <button onClick={handleSaveToSpreadsheet} disabled={isLoading} className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black text-lg py-5 rounded-2xl shadow-xl hover:scale-[1.01] transition-all cursor-pointer">
                        {isLoading ? '전송하는 중...' : '🚀 기사 최종 제출하기'}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-6">
                <div className="bg-slate-900 text-white p-8 rounded-[2rem] shadow-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border border-slate-800">
                  <div>
                    <span className="text-xs font-black text-emerald-400 bg-emerald-400/10 px-3 py-1.5 rounded-lg border border-emerald-500/30">교사용 관리자 모드</span>
                    <h2 className="text-3xl font-black mt-3">구글 시트 응답 현황 <span className="text-xl text-emerald-300 ml-2">({loggedInTeacher} 반 접속중)</span></h2>
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                    <button onClick={() => openCanvasModal(loggedInTeacher)} className="bg-amber-600 hover:bg-amber-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg cursor-pointer">📰 캔버스(신문 보기)</button>
                    <button onClick={fetchSheetData} disabled={isLoading} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg cursor-pointer">🔄 새로고침</button>
                    <button onClick={downloadCSV} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg cursor-pointer">📊 엑셀 다운로드</button>
                    <button onClick={handleClearSheet} disabled={isLoading} className="bg-rose-600 hover:bg-rose-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg cursor-pointer">🗑️ 데이터 비우기</button>
                  </div>
                </div>

                <div className="bg-white rounded-[2rem] border border-slate-200 shadow-md overflow-hidden">
                  <div className="p-5 border-b bg-slate-50 flex justify-between items-center">
                    <span className="font-black text-base text-slate-800">총 제출 기사: <span className="text-indigo-600">{teacherDataList.filter(row => row.targetTeacher === loggedInTeacher).length}</span>건</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-700 border-collapse">
                      <thead className="bg-slate-100/50 text-slate-900 font-black border-b">
                        <tr>
                          <th className="p-4 border-r whitespace-nowrap">시간</th>
                          <th className="p-4 border-r">이름</th>
                          <th className="p-4 border-r">기사 주제</th>
                          <th className="p-4 border-r">기분 & 소감</th>
                          <th className="p-4 min-w-[300px]">최종 기사문</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y font-medium">
                        {teacherDataList.filter(row => row.targetTeacher === loggedInTeacher).length === 0 ? (
                          <tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold">아직 제출된 기사가 없습니다.</td></tr>
                        ) : (
                          teacherDataList.filter(row => row.targetTeacher === loggedInTeacher).map((row) => (
                            <tr key={row.id} className="hover:bg-indigo-50/30 transition-colors">
                              <td className="p-4 border-r whitespace-nowrap text-xs text-slate-500 font-bold">{row.timestamp}</td>
                              <td className="p-4 border-r font-black text-slate-900 text-base">{row.name}</td>
                              <td className="p-4 border-r font-bold text-purple-700 max-w-[200px] truncate">{row.activityTitle}</td>
                              <td className="p-4 border-r max-w-[200px]">
                                <div className="text-xs font-black text-amber-600 mb-1">{row.mood}</div>
                                <div className="text-xs text-slate-600 truncate">{row.shortMsg}</div>
                              </td>
                              <td className="p-4 text-slate-800 font-bold leading-relaxed">{row.draftText}</td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
          
          {activeTab === 'student' && !showPasswordModal && (
            <button onClick={() => {setAuthMode('login'); setShowPasswordModal(true);}} className="fixed bottom-8 right-8 bg-slate-900 hover:bg-slate-800 text-white px-6 py-4 rounded-full font-black shadow-2xl transition-all hover:scale-105 flex items-center gap-3 z-40 border border-slate-700 cursor-pointer">
              <span className="text-xl">🔒</span>
              <span>선생님 전용</span>
            </button>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
