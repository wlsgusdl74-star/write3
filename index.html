<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 학급 신문 작성 도우미</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .newspaper-font {
      font-family: 'Gowun Batang', serif;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-pop-in {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHFQIAmMj-fRxn3yYtX97sfIrn5jdwKM2VgEg0dXOg9PJh3jQhiC7Fc3o4vA3wGAtwAw/exec"; 

    const { useState, useEffect, useRef } = React;

    const MOOD_OPTIONS = ['😊 신나고 즐거워요', '🥰 뿌듯하고 행복해요', '🤔 신기하고 재미있어요', '😌 편안하고 유익해요', '🔥 의욕이 넘쳐요'];

    function App() {
      const [activeTab, setActiveTab] = useState('student');
      
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [loginClass, setLoginClass] = useState(''); 
      const [registerClass, setRegisterClass] = useState(''); 
      const [passwordInput, setPasswordInput] = useState(''); 
      const [loggedInTeacher, setLoggedInTeacher] = useState(''); 
      const passwordInputRef = useRef(null);

      const [studentName, setStudentName] = useState('');
      const [targetTeacher, setTargetTeacher] = useState(''); 
      const [activityTitle, setActivityTitle] = useState('');
      const [mood, setMood] = useState('😊 신나고 즐거워요');
      const [shortMsg, setShortMsg] = useState('');
      const [step, setStep] = useState(1);
      
      const [w6, setW6] = useState({ who: '', when: '', where: '', what: '', how: '', why: '' });
      
      const [line1, setLine1] = useState(''); 
      const [line2, setLine2] = useState(''); 
      const [line3, setLine3] = useState(''); 
      const [line4, setLine4] = useState(''); 
      const [line5, setLine5] = useState(''); 
      
      const [draftText, setDraftText] = useState('');
      const [grammarIssues, setGrammarIssues] = useState([]);
      
      const [showGuideModal, setShowGuideModal] = useState(false);
      const [isConvertingToNews, setIsConvertingToNews] = useState(false);
      
      const [isGeneratingTitle, setIsGeneratingTitle] = useState(false);
      const [suggestedTitles, setSuggestedTitles] = useState([]);

      const [teacherDataList, setTeacherDataList] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [loadingText, setLoadingText] = useState('처리 중입니다...');
      const [toastMsg, setToastMsg] = useState(null);

      const [showCanvasModal, setShowCanvasModal] = useState(false);
      const [canvasArticles, setCanvasArticles] = useState([]);
      const [selectedClassForCanvas, setSelectedClassForCanvas] = useState('');

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      useEffect(() => {
        if (showPasswordModal && passwordInputRef.current) {
          setTimeout(() => passwordInputRef.current.focus(), 100);
        }
      }, [showPasswordModal, authMode]);

      useEffect(() => {
        if (activeTab === 'teacher' && loggedInTeacher) fetchSheetData();
      }, [activeTab, loggedInTeacher]);

      const fetchSheetData = async () => {
        setIsLoading(true);
        setLoadingText('📊 데이터를 불러오는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getData`).catch(() => null);
          if (!response || !response.ok) {
            triggerToast('⚠️ 서버 연결이 원활하지 않습니다.');
            setTeacherDataList([]);
            return;
          }
          const result = await response.json();
          if (result.success) {
            setTeacherDataList(result.data || []);
          } else {
            triggerToast('❌ 조회 실패: ' + (result.message || '오류 발생'));
          }
        } catch (err) {
          triggerToast('❌ 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const openCanvasModal = async (className) => {
        const targetCls = className || targetTeacher.trim() || loggedInTeacher;
        if (!targetCls) return triggerToast('⚠️ 확인할 반 이름을 입력해주세요!');

        setIsLoading(true);
        setLoadingText('📰 신문 캔버스를 불러오는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getData`).catch(() => null);
          if (!response || !response.ok) {
            triggerToast('⚠️ 데이터를 불러오지 못했습니다.');
            return;
          }
          const result = await response.json();
          if (result.success) {
            const filtered = (result.data || []).filter(row => row.targetTeacher === targetCls);
            setCanvasArticles(filtered);
            setSelectedClassForCanvas(targetCls);
            setShowCanvasModal(true);
          }
        } catch (err) {
          triggerToast('❌ 통신 오류 발생');
        } finally {
          setIsLoading(false);
        }
      };

      const handleTeacherRegister = async () => {
        const trimmedClass = registerClass.trim();
        if (!trimmedClass) return triggerToast('⚠️ 반 이름을 입력해주세요.');
        if (!passwordInput.trim()) return triggerToast('⚠️ 비밀번호를 입력해주세요.');

        setIsLoading(true);
        setLoadingText('새로운 반을 등록하는 중...');
        
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'registerTeacher', className: trimmedClass, password: passwordInput }),
            redirect: 'follow'
          });
          
          const text = await response.text();
          try {
            const result = JSON.parse(text);
            if (result.success) {
              triggerToast(`🎉 [${trimmedClass}] 반이 등록되었습니다!`);
              setLoggedInTeacher(trimmedClass);
              setShowPasswordModal(false);
              setPasswordInput('');
              setRegisterClass('');
              setActiveTab('teacher');
            } else {
              triggerToast('❌ 등록 실패: ' + result.message);
            }
          } catch (parseError) {
            triggerToast('❌ 구글 서버 응답 오류 발생');
          }
        } catch (err) {
          triggerToast('❌ 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleTeacherLogin = async () => {
        const trimmedLoginClass = loginClass.trim();
        if (!trimmedLoginClass) return triggerToast('⚠️ 로그인할 반 이름을 입력해주세요.');
        if (!passwordInput.trim()) return triggerToast('⚠️ 비밀번호를 입력해주세요.');

        setIsLoading(true);
        setLoadingText('비밀번호 확인 중...');
        
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'loginTeacher', className: trimmedLoginClass, password: passwordInput }),
            redirect: 'follow'
          });
          
          const text = await response.text();
          try {
            const result = JSON.parse(text);
            if (result.success) {
              setShowPasswordModal(false);
              setPasswordInput('');
              setLoginClass('');
              setLoggedInTeacher(trimmedLoginClass);
              setActiveTab('teacher');
              triggerToast(`🔓 환영합니다, ${trimmedLoginClass} 선생님!`);
            } else {
              triggerToast('❌ 로그인 실패: 반 이름이나 비밀번호가 틀렸습니다.');
              setPasswordInput('');
            }
          } catch(e) {
            triggerToast('❌ 구글 서버 응답 오류 발생');
          }
        } catch (err) {
          triggerToast('❌ 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleClearSheet = async () => {
        if (!window.confirm(`정말로 [${loggedInTeacher}] 반의 응답 데이터를 초기화하시겠습니까?`)) return;
        
        setIsLoading(true);
        setLoadingText('🗑️ 응답 데이터를 비우는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=clearData&teacher=${encodeURIComponent(loggedInTeacher)}`);
          const result = await response.json();
          if (result.success) {
            triggerToast(result.message);
            fetchSheetData();
          } else {
            triggerToast('❌ ' + result.message);
          }
        } catch (err) {
          triggerToast('❌ 통신 오류 발생');
        } finally {
          setIsLoading(false);
        }
      };

      const handleSaveToSpreadsheet = async () => {
        const finalTeacher = targetTeacher.trim();
        if (!studentName.trim() || !activityTitle.trim()) return triggerToast('⚠️ 학생 이름과 기사 주제를 모두 입력해 주세요!');
        if (!finalTeacher) return triggerToast('⚠️ 우리 반 이름을 입력해 주세요!');

        setIsLoading(true);
        setLoadingText('🚀 기사를 제출하는 중...');

        const payload = {
          action: 'saveArticle',
          name: studentName, 
          activityTitle: activityTitle, 
          mood: mood, 
          shortMsg: shortMsg,
          w6: w6, 
          sentence1: line1, 
          sentence2: line2, 
          sentence3: line3, 
          sentence4: line4, 
          draftText: draftText,
          targetTeacher: finalTeacher 
        };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const text = await response.text();
          const result = JSON.parse(text);
          if (result.success) {
            triggerToast(result.message || '🎉 기사가 성공적으로 제출되었습니다!');
            setStudentName('');
            setActivityTitle('');
            setShortMsg('');
            setW6({ who: '', when: '', where: '', what: '', how: '', why: '' });
            setLine1(''); setLine2(''); setLine3(''); setLine4(''); setLine5('');
            setDraftText('');
            setStep(1);
          } else {
            triggerToast('❌ 제출 실패: ' + result.message);
          }
        } catch (err) {
          triggerToast('❌ 저장 실패: 네트워크 연결을 확인해 주세요.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleGenerateTitles = () => {
        if (!draftText || draftText.trim() === '') return triggerToast('💡 먼저 기사 내용을 완성해주세요!');
        setIsGeneratingTitle(true);
        triggerToast('🤖 어울리는 기사 제목을 추천하는 중...');

        setTimeout(() => {
          const defaultTitles = [
            `[집중보도] ${activityTitle || '우리들의 특별한 활동'}, 그 현장을 가다!`,
            `다 함께 즐긴 ${activityTitle || '학교 활동'}, 웃음꽃이 피어나다`,
            `"정말 소중한 추억이었다"… 성공적으로 마친 ${activityTitle || '활동'}`
          ];
          setSuggestedTitles(defaultTitles);
          setIsGeneratingTitle(false);
          triggerToast('✨ 멋진 제목을 추천했어요!');
        }, 500);
      };

      const convertToNewsTone = () => {
        if (!draftText.trim()) return triggerToast('💡 변환할 기사 내용을 먼저 작성해 주세요!');
        setIsConvertingToNews(true);
        triggerToast('📰 기사 말투로 다듬고 있어요...');

        setTimeout(() => {
          let text = draftText;
          text = text.replace(/했어요/g, '하였다').replace(/있어요/g, '있다').replace(/였습니다/g, '이었다').replace(/됐어요/g, '되었다');
          text = text.replace(/요([.!?]|$)/g, '다$1').replace(/어요([.!?]|$)/g, '었다$1').replace(/았어요([.!?]|$)/g, '았다$1').replace(/었어요([.!?]|$)/g, '었다$1');
          
          if (!text.endsWith('.') && !text.endsWith('다')) {
            text += '.';
          }

          setDraftText(text);
          setIsConvertingToNews(false);
          triggerToast('✨ 객관적이고 명확한 기사 말투로 변환되었습니다!');
        }, 500);
      };

      const combineFiveLines = () => {
        const lines = [line1, line2, line3, line4, line5].map(s => s.trim()).filter(Boolean);
        if (lines.length === 0) return triggerToast('💡 내용을 하나 이상 입력해 주세요!');
        setDraftText(lines.join(' '));
        triggerToast('🎉 5줄 기사 글이 풍부하게 합쳐졌습니다!');
      };

      const scanGrammar = () => {
        triggerToast('🔍 맞춤법을 검사하고 있습니다...');
        let issues = [];
        if (draftText.includes('떡뽂이')) issues.push({ id: 'g1', errorWord: '떡뽂이', correct: '떡볶이', desc: "'볶다'에서 온 말이므로 '떡볶이'가 바른 표현이에요!" });
        if (draftText.includes('맛있엇다')) issues.push({ id: 'g2', errorWord: '맛있엇다', correct: '맛있었다', desc: "지난 일은 쌍시옷(ㅆ)을 써서 '맛있었다'로 써요!" });
        if (issues.length === 0) issues.push({ id: 'g3', errorWord: '참 재밌엇다', correct: '참 재미있었다', desc: "'재미있었다'로 바르게 고쳐주세요!" });
        setGrammarIssues(issues);
      };

      const resolveIssue = (issueId, correct) => {
        setDraftText((prev) => prev.replace(/참 재밌엇다/g, correct)); 
        setGrammarIssues((prev) => prev.filter(i => i.id !== issueId));
        triggerToast('💮 정답 도장이 찍혔습니다!');
      };

      const downloadCSV = () => {
        const myClassData = teacherDataList.filter(row => row.targetTeacher === loggedInTeacher);
        if (myClassData.length === 0) return triggerToast('⚠️ 다운로드할 우리 반 데이터가 없습니다.');
        
        let csvContent = '\uFEFF응답 일시,이름,기분,한 줄 메시지,기사 주제,줄1,줄2,줄3,줄4,줄5,최종기사문\n';
        myClassData.forEach((row) => {
          const safe = (txt) => `"${(txt || '').toString().replace(/"/g, '""')}"`;
          csvContent += `${safe(row.timestamp)},${safe(row.name)},${safe(row.mood)},${safe(row.shortMsg)},${safe(row.activityTitle)},${safe(row.sentence1)},${safe(row.sentence2)},${safe(row.sentence3)},${safe(row.sentence4)},${safe(row.draftText)}\n`;
        });
        const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
        const a = document.createElement('a');
        a.href = url; a.download = `학급신문_${loggedInTeacher}_응답목록.csv`;
        a.click();
      };

      return (
        <div className="min-h-screen pb-24 relative">
          {isLoading && (
            <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center text-white px-4">
              <div className="bg-white text-slate-900 p-6 rounded-3xl shadow-2xl flex flex-col items-center gap-4 max-w-sm w-full border border-slate-100">
                <div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <p className="font-extrabold text-base text-center">{loadingText}</p>
              </div>
            </div>
          )}

          {showGuideModal && (
            <div className="fixed inset-0 z-[80] bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white text-slate-900 w-full max-w-2xl rounded-[2.5rem] shadow-2xl p-8 my-8 animate-pop-in relative space-y-6">
                <button onClick={() => setShowGuideModal(false)} className="absolute top-6 right-6 w-10 h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full font-black text-lg flex items-center justify-center shadow transition-all cursor-pointer">✕</button>

                <div className="text-center border-b pb-4">
                  <div className="text-xs font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full inline-block mb-1">기자 글쓰기 가이드</div>
                  <h3 className="text-2xl font-black text-slate-900">📰 5줄 풍부한 기사 쓰기 팁</h3>
                </div>

                <div className="space-y-3 text-sm">
                  <div className="bg-slate-50 p-4 rounded-2xl border">
                    <strong className="text-indigo-700 block mb-1">① 구체적인 사실 적기</strong>
                    <p className="text-xs text-slate-600">"재밌었다" 대신 "모둠원들과 역할을 나누어 끝까지 완성했다"처럼 구체적으로 써보세요.</p>
                  </div>
                </div>

                <div className="text-center pt-2">
                  <button onClick={() => setShowGuideModal(false)} className="bg-slate-900 text-white px-8 py-3 rounded-xl font-black text-sm shadow cursor-pointer">확인 완료</button>
                </div>
              </div>
            </div>
          )}

          {showCanvasModal && (
            <div className="fixed inset-0 z-[70] bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-4 overflow-y-auto">
              <div className="bg-amber-50 text-slate-900 w-full max-w-4xl rounded-[2.5rem] shadow-2xl border-4 border-amber-900/20 p-8 my-8 animate-pop-in relative">
                <button onClick={() => setShowCanvasModal(false)} className="absolute top-6 right-6 w-10 h-10 bg-amber-900 text-amber-50 rounded-full font-black text-lg flex items-center justify-center shadow-lg hover:bg-amber-800 transition-all cursor-pointer">✕</button>
                <div className="text-center border-b-4 border-double border-amber-900 pb-6 mb-8">
                  <h2 className="text-4xl sm:text-5xl font-black newspaper-font text-amber-950 tracking-tight">[{selectedClassForCanvas}] 학 급 신 문</h2>
                </div>
                <div className="text-center mt-8 pt-4 border-t border-amber-900/20">
                  <button onClick={() => setShowCanvasModal(false)} className="bg-amber-900 text-amber-50 px-8 py-3.5 rounded-2xl font-black text-sm shadow-lg hover:bg-amber-800 cursor-pointer">닫기</button>
                </div>
              </div>
            </div>
          )}

          {showPasswordModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/85 backdrop-blur-sm flex flex-col items-center justify-center px-4">
              <div className="bg-white rounded-[2rem] shadow-2xl p-8 w-full max-w-sm border border-slate-100 animate-pop-in">
                <div className="text-center mb-6">
                  <h3 className="text-2xl font-black text-slate-900">선생님 전용</h3>
                </div>
                <div className="flex gap-2 mb-6 p-1 bg-slate-100 rounded-xl">
                  <button onClick={() => setAuthMode('login')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${authMode === 'login' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>로그인</button>
                  <button onClick={() => setAuthMode('register')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${authMode === 'register' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>반 만들기</button>
                </div>
                {authMode === 'login' ? (
                  <div className="space-y-4">
                    <input type="text" value={loginClass} onChange={(e) => setLoginClass(e.target.value)} placeholder="반 이름 입력" className="w-full px-4 py-3 bg-slate-50 rounded-xl border font-bold outline-none" />
                    <input type="password" ref={passwordInputRef} value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} placeholder="비밀번호 입력" className="w-full px-4 py-3 bg-slate-50 rounded-xl border font-bold text-center tracking-widest outline-none" />
                    <div className="flex gap-3 pt-3">
                      <button onClick={() => setShowPasswordModal(false)} className="flex-1 py-3.5 rounded-xl bg-slate-100 font-bold text-slate-600">취소</button>
                      <button onClick={handleTeacherLogin} className="flex-1 py-3.5 rounded-xl bg-indigo-600 text-white font-bold">입장하기</button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <input type="text" value={registerClass} onChange={(e) => setRegisterClass(e.target.value)} placeholder="새 반 이름 입력" className="w-full px-4 py-3 bg-slate-50 rounded-xl border font-bold outline-none" />
                    <input type="password" ref={passwordInputRef} value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} placeholder="비밀번호 입력" className="w-full px-4 py-3 bg-slate-50 rounded-xl border font-bold text-center tracking-widest outline-none" />
                    <div className="flex gap-3 pt-3">
                      <button onClick={() => setShowPasswordModal(false)} className="flex-1 py-3.5 rounded-xl bg-slate-100 font-bold text-slate-600">취소</button>
                      <button onClick={handleTeacherRegister} className="flex-1 py-3.5 rounded-xl bg-emerald-600 text-white font-bold">반 만들기</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-3 animate-bounce">
              <span className="font-bold text-sm">{toastMsg}</span>
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-tr from-indigo-600 to-purple-600 p-3 rounded-2xl text-white shadow-md">📰</div>
                <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">우리 반 학급 신문 작성 도우미</h1>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => openCanvasModal()} className="bg-amber-600 text-white px-4 py-2.5 rounded-xl font-black text-sm shadow-md cursor-pointer">📰 캔버스</button>
                <div className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border">
                  <button onClick={() => setActiveTab('student')} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'student' ? 'bg-white text-indigo-600 shadow-md' : 'text-slate-500'}`}>📖 학생용</button>
                  <button onClick={() => { if (activeTab !== 'teacher') setShowPasswordModal(true); }} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'teacher' ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500'}`}>📊 교사용</button>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 mt-6">
            {activeTab === 'student' ? (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                  <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} placeholder="👤 이름 입력" className="bg-slate-50 px-4 py-2.5 rounded-2xl font-bold text-sm border outline-none" />
                  <input type="text" value={targetTeacher} onChange={(e) => setTargetTeacher(e.target.value)} placeholder="👨‍🏫 우리 반 (예: 5반)" className="bg-indigo-50 px-4 py-2.5 rounded-2xl font-bold text-sm border border-indigo-200 outline-none" />
                  <input type="text" value={activityTitle} onChange={(e) => setActivityTitle(e.target.value)} placeholder="✨ 기사 주제 (예: 요리교실)" className="bg-purple-50 px-4 py-2.5 rounded-2xl font-bold text-sm border border-purple-200 outline-none" />
                  <select value={mood} onChange={(e) => setMood(e.target.value)} className="bg-amber-50 px-4 py-2.5 rounded-2xl font-bold text-sm border border-amber-200 outline-none cursor-pointer">
                    {MOOD_OPTIONS.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                  </select>
                </div>

                {/* 🌟 1, 2, 3단계 직접 클릭해서 이동할 수 있는 상단 탭 버튼 */}
                <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-3 gap-3 text-center">
                  <button onClick={() => setStep(1)} className={`p-3.5 rounded-2xl font-extrabold text-sm cursor-pointer transition-all ${step === 1 ? 'bg-amber-500 text-white shadow-lg scale-[1.02]' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>1단계: 육하원칙</button>
                  <button onClick={() => setStep(2)} className={`p-3.5 rounded-2xl font-extrabold text-sm cursor-pointer transition-all ${step === 2 ? 'bg-indigo-600 text-white shadow-lg scale-[1.02]' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>2단계: 5줄 내용 풍부하게 작성</button>
                  <button onClick={() => setStep(3)} className={`p-3.5 rounded-2xl font-extrabold text-sm cursor-pointer transition-all ${step === 3 ? 'bg-emerald-600 text-white shadow-lg scale-[1.02]' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>3단계: 마무리 및 다듬기</button>
                </div>

                {step === 1 && (
                  <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-md space-y-6">
                    <h2 className="text-3xl font-black text-slate-900"><span className="text-amber-500 mr-2">1단계.</span> 육하원칙 단어 카드를 채워요!</h2>
                    <div className="grid grid-cols-1 gap-4">
                      {[
                        { key: 'who', label: '👤 누가', placeholder: '예: 우리 반 친구들과 선생님이' },
                        { key: 'when', label: '📅 언제', placeholder: '예: 지난주 화요일 3교시에' },
                        { key: 'where', label: '📍 어디서', placeholder: '예: 교실에서' },
                        { key: 'what', label: '🍕 무엇을', placeholder: '예: 떡볶이 만들기' },
                        { key: 'how', label: '🍳 어떻게', placeholder: '예: 재료를 썰고 양념을 섞어서' },
                        { key: 'why', label: '💡 왜', placeholder: '예: 친구들과 맛있게 나눠 먹으려고' }
                      ].map((item) => (
                        <div key={item.key} className="p-5 rounded-2xl border bg-slate-50 space-y-2">
                          <span className="font-black text-indigo-700">{item.label}</span>
                          <input type="text" value={w6[item.key] || ''} onChange={(e) => setW6({ ...w6, [item.key]: e.target.value })} placeholder={item.placeholder} className="w-full px-4 py-3 bg-white rounded-xl border font-bold outline-none" />
                        </div>
                      ))}
                    </div>
                    <div className="flex justify-end pt-5">
                      <button onClick={() => setStep(2)} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black text-lg shadow-xl cursor-pointer">2단계(5줄 내용 작성)로 이동 👉</button>
                    </div>
                  </div>
                )}

                {/* 🌟 2단계: 5줄 내용 풍부하게 작성하기 */}
                {step === 2 && (
                  <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-md space-y-6">
                    <div className="flex justify-between items-center border-b pb-4">
                      <h2 className="text-2xl font-black text-slate-900"><span className="text-indigo-600 mr-2">2단계.</span> 5줄 기사 내용 풍부하게 작성하기</h2>
                      <button onClick={() => setShowGuideModal(true)} className="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-200 cursor-pointer">💡 글쓰기 팁</button>
                    </div>

                    <div className="bg-indigo-50 p-4 rounded-2xl text-xs font-bold text-indigo-900 space-y-1">
                      <p>✨ 1단계 단어를 참고하여 아래 **5개의 줄**에 생각을 자세히 적어보세요. 최소 5줄 이상으로 길게 쓰면 멋진 기사가 완성됩니다!</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="space-y-4 bg-amber-50 p-6 rounded-3xl border border-amber-200">
                        <div className="space-y-3">
                          <div>
                            <label className="text-xs font-black text-amber-900 block mb-1">줄 1 [시작]: 언제, 어디서, 누가 무엇을 했나요?</label>
                            <input type="text" value={line1} onChange={(e) => setLine1(e.target.value)} placeholder="예: 어제 우리 반은 교실에서 신나는 요리 활동을 시작했다." className="w-full px-4 py-3 bg-white rounded-xl border font-bold text-sm outline-none" />
                          </div>

                          <div>
                            <label className="text-xs font-black text-amber-900 block mb-1">줄 2 [과정]: 어떻게 진행되었나요?</label>
                            <input type="text" value={line2} onChange={(e) => setLine2(e.target.value)} placeholder="예: 모둠별로 재료를 손질하고 순서에 맞춰 정성껏 만들었다." className="w-full px-4 py-3 bg-white rounded-xl border font-bold text-sm outline-none" />
                          </div>

                          <div>
                            <label className="text-xs font-black text-amber-900 block mb-1">줄 3 [하이라이트]: 가장 인상 깊은 장면은 무엇인가요?</label>
                            <input type="text" value={line3} onChange={(e) => setLine3(e.target.value)} placeholder="예: 완성된 음식을 맛보며 친구들과 환하게 웃음 지었다." className="w-full px-4 py-3 bg-white rounded-xl border font-bold text-sm outline-none" />
                          </div>

                          <div>
                            <label className="text-xs font-black text-amber-900 block mb-1">줄 4 [소감]: 새롭게 느낀 점이나 배운 점은 무엇인가요?</label>
                            <input type="text" value={line4} onChange={(e) => setLine4(e.target.value)} placeholder="예: 협동하는 과정의 즐거움을 깊이 깨닫게 되었다." className="w-full px-4 py-3 bg-white rounded-xl border font-bold text-sm outline-none" />
                          </div>

                          <div>
                            <label className="text-xs font-black text-amber-900 block mb-1">줄 5 [마무리]: 앞으로의 다짐이나 한마디!</label>
                            <input type="text" value={line5} onChange={(e) => setLine5(e.target.value)} placeholder="예: 다음에도 다 함께 참여하는 활동이 기다려진다." className="w-full px-4 py-3 bg-white rounded-xl border font-bold text-sm outline-none" />
                          </div>
                        </div>
                        
                        <button onClick={combineFiveLines} className="w-full bg-slate-900 text-white font-black py-4 rounded-xl cursor-pointer shadow-md">✨ 5줄 내용을 풍부하게 하나로 합치기 👉</button>
                      </div>

                      <div className="space-y-4 bg-slate-50 p-6 rounded-3xl border flex flex-col justify-between">
                        <div className="space-y-3">
                          <span className="font-black text-sm text-slate-800">📝 완성된 5줄 기사 초안 미리보기</span>
                          <textarea value={draftText} onChange={(e) => setDraftText(e.target.value)} placeholder="왼쪽에서 5줄을 작성하고 합치기 버튼을 누르면 이곳에 풍부한 기사글이 나타납니다." rows={12} className="w-full p-4 bg-white rounded-2xl border font-medium text-sm leading-relaxed outline-none resize-none" />
                        </div>
                        <div className="flex gap-3">
                          <button onClick={() => setStep(1)} className="w-1/3 bg-slate-200 text-slate-700 py-4 rounded-2xl font-black text-base cursor-pointer">👈 1단계</button>
                          <button onClick={() => setStep(3)} className="w-2/3 bg-emerald-600 text-white py-4 rounded-2xl font-black text-lg shadow-lg cursor-pointer">3단계(다듬기)로 이동 👉</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 🌟 3단계: 마무리 및 다듬기 */}
                {step === 3 && (
                  <div className="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-md space-y-8">
                    <div className="flex justify-between items-center border-b pb-5">
                      <h2 className="text-2xl font-black text-slate-900"><span className="text-emerald-600 mr-2">3단계.</span> 마무리 및 다듬기</h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-gradient-to-br from-purple-50 to-indigo-50 p-6 rounded-3xl border border-purple-200 space-y-4">
                        <div className="flex justify-between items-center">
                          <h3 className="font-black text-purple-900">✨ AI 기사 제목 추천</h3>
                          <button onClick={handleGenerateTitles} disabled={isGeneratingTitle} className="bg-purple-600 text-white px-4 py-2 rounded-xl font-bold text-xs cursor-pointer">제목 추천받기</button>
                        </div>
                        <input type="text" value={activityTitle} onChange={(e) => setActivityTitle(e.target.value)} placeholder="기사 제목 입력" className="w-full px-4 py-3 bg-white rounded-xl border font-black text-center text-purple-900 outline-none" />
                        {suggestedTitles.length > 0 && (
                          <div className="flex flex-wrap gap-2">
                            {suggestedTitles.map((t, i) => (
                              <button key={i} onClick={() => setActivityTitle(t)} className="bg-white px-3 py-1.5 border border-purple-200 rounded-lg text-xs font-bold text-purple-800 cursor-pointer">{t}</button>
                            ))}
                          </div>
                        )}
                      </div>

                      <div className="bg-slate-50 p-6 rounded-3xl border space-y-4">
                        <div className="flex justify-between items-center">
                          <h3 className="font-black text-slate-900">🛠️ 글 다듬기 도구</h3>
                          <button onClick={scanGrammar} className="bg-slate-200 text-slate-800 px-4 py-2 rounded-xl font-bold text-xs cursor-pointer">🔍 맞춤법 검사</button>
                        </div>
                        <button onClick={convertToNewsTone} disabled={isConvertingToNews} className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black py-3 rounded-xl shadow cursor-pointer">
                          {isConvertingToNews ? '변환 중...' : '📰 기사 말투로 자동 변환하기'}
                        </button>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <span className="text-xs font-extrabold text-slate-500">최종 완성된 5줄 기사문</span>
                      <textarea value={draftText} onChange={(e) => setDraftText(e.target.value)} rows={8} className="w-full p-5 bg-slate-50 rounded-2xl border font-bold text-base leading-relaxed outline-none" />
                    </div>

                    {grammarIssues.length > 0 && (
                      <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 space-y-2">
                        <h4 className="text-xs font-black text-amber-800">💡 맞춤법 교정</h4>
                        {grammarIssues.map((issue) => (
                          <div key={issue.id} className="bg-white p-3 rounded-xl border flex justify-between items-center text-xs">
                            <span>"{issue.errorWord}" &rarr; <strong className="text-emerald-600">{issue.correct}</strong></span>
                            <button onClick={() => resolveIssue(issue.id, issue.correct)} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold cursor-pointer">적용하기</button>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="flex gap-4">
                      <button onClick={() => setStep(2)} className="w-1/3 bg-slate-200 text-slate-700 py-4 rounded-2xl font-black text-base cursor-pointer">👈 2단계로 이동</button>
                      <div className="w-2/3 bg-indigo-50 p-6 rounded-3xl border border-indigo-200 space-y-4">
                        <h3 className="font-black text-indigo-900">📮 기사 최종 제출하기</h3>
                        <input type="text" value={shortMsg} onChange={(e) => setShortMsg(e.target.value)} placeholder="한 줄 소감" className="w-full px-4 py-3 bg-white rounded-xl border font-bold text-sm outline-none" />
                        <button onClick={handleSaveToSpreadsheet} disabled={isLoading} className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl cursor-pointer">
                          {isLoading ? '제출 중...' : '🚀 기사 최종 제출하기'}
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-6">
                <div className="bg-slate-900 text-white p-8 rounded-[2rem] flex justify-between items-center">
                  <div>
                    <span className="text-xs font-black text-emerald-400">교사용 관리자 모드</span>
                    <h2 className="text-3xl font-black mt-2">({loggedInTeacher} 반 응답 현황)</h2>
                  </div>
                  <div className="flex gap-3">
                    <button onClick={() => openCanvasModal(loggedInTeacher)} className="bg-amber-600 text-white px-5 py-3 rounded-xl font-bold text-sm cursor-pointer">📰 캔버스 보기</button>
                    <button onClick={downloadCSV} className="bg-emerald-600 text-white px-5 py-3 rounded-xl font-bold text-sm cursor-pointer">📊 엑셀 다운로드</button>
                    <button onClick={handleClearSheet} className="bg-rose-600 text-white px-5 py-3 rounded-xl font-bold text-sm cursor-pointer">🗑️ 초기화</button>
                  </div>
                </div>
                <div className="bg-white rounded-[2rem] border p-6">
                  <h3 className="font-black mb-4">제출된 기사 목록 ({teacherDataList.filter(r => r.targetTeacher === loggedInTeacher).length}건)</h3>
                  <div className="space-y-4 max-h-[50vh] overflow-y-auto">
                    {teacherDataList.filter(r => r.targetTeacher === loggedInTeacher).map((row, idx) => (
                      <div key={idx} className="p-4 bg-slate-50 rounded-2xl border space-y-1">
                        <div className="flex justify-between font-bold text-xs text-slate-500">
                          <span>기자: {row.name}</span>
                          <span>{row.timestamp}</span>
                        </div>
                        <h4 className="font-black text-slate-900 text-base">{row.activityTitle}</h4>
                        <p className="text-sm font-medium text-slate-700 leading-relaxed">{row.draftText}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
