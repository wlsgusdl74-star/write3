<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 학급 신문 작성 도우미</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    .newspaper-font { font-family: 'Gowun Batang', serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHFQIAmMj-fRxn3yYtX97sfIrn5jdwKM2VgEg0dXOg9PJh3jQhiC7Fc3o4vA3wGAtwAw/exec"; 
    const GEMINI_API_KEY = "AQ.Ab8RN6KBbvNmL3WUMvNppmIvYJ3STcPu7ZCryktfiEGDOgRNdQ"; 

    const { useState, useEffect, useRef } = React;

    function App() {
      // ... (기존 state들 유지)
      const [w6, setW6] = useState({ who: '', when: '', where: '', what: '', how: '', why: '' });
      const [draftText, setDraftText] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      // 🌟 단어 나열을 문장으로 변환하는 AI 함수
      const generateSentencesFromW6 = async () => {
        const hasInput = Object.values(w6).some(v => v.trim() !== '');
        if (!hasInput) return alert('💡 육하원칙 단어를 먼저 채워주세요!');
        
        setIsGenerating(true);
        try {
          const prompt = `다음 육하원칙 단어들을 바탕으로 초등학생 기사문 4문장을 작성해줘. 
          규칙: 1. 기사체(~다)로 쓸 것. 2. 객관적일 것. 3. 단어들을 자연스럽게 이을 것.
          단어: 누가(${w6.who}), 언제(${w6.when}), 어디서(${w6.where}), 무엇을(${w6.what}), 어떻게(${w6.how}), 왜(${w6.why})`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await response.json();
          const result = data.candidates[0].content.parts[0].text;
          setDraftText(result);
        } catch (e) {
          alert('변환 실패: 육하원칙 단어를 확인해주세요.');
        } finally {
          setIsGenerating(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-6">
          <h1 className="text-2xl font-black mb-6">📰 학급 신문 작성</h1>
          
          {/* 육하원칙 카드 */}
          <div className="grid grid-cols-2 gap-3 mb-6">
            {Object.keys(w6).map(key => (
              <input key={key} placeholder={key} value={w6[key]} onChange={e => setW6({...w6, [key]: e.target.value})} className="p-3 border rounded-xl" />
            ))}
          </div>

          <button onClick={generateSentencesFromW6} className="w-full bg-blue-600 text-white p-4 rounded-xl font-bold mb-6">
            {isGenerating ? '변환 중...' : '🪄 단어 나열을 문장으로 자동 변환하기'}
          </button>

          <textarea value={draftText} onChange={e => setDraftText(e.target.value)} className="w-full h-40 p-4 border rounded-xl" placeholder="문장이 여기에 나타납니다." />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
